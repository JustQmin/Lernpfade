<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Spaltung von Saccharose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap">
<style>
  :root { --acc: #005A8D; --acc2: #A44400; --txt: #1A1A1A; --muted: #5E5E5E; --line: #D5D5D5; --bg: #ffffff; --merke: #FFFDF7; --merkeb: #D8B24A; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Lexend', system-ui, sans-serif; color: var(--txt); background: var(--bg); font-size: 18px; line-height: 1.55; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 30px; line-height: 1.2; margin: 0 0 6px; }
  .fach { color: var(--acc); font-weight: 700; font-size: 15px; }
  .bar { width: 64px; height: 3px; background: var(--acc); border-radius: 2px; margin: 10px 0 24px; }
  .intro { background: var(--merke); border-left: 4px solid var(--merkeb); padding: 16px 20px; margin-bottom: 20px; }
  .downloads { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 32px; }
  .btn { display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 12px 20px; border-radius: 10px; background: var(--acc); color: #fff; text-decoration: none; font-weight: 600; }
  .btn.sec { background: #fff; color: var(--acc); border: 2px solid var(--acc); }
  .btn svg { width: 22px; height: 22px; flex-shrink: 0; }
  .btn:focus-visible { outline: 3px solid var(--acc2); outline-offset: 2px; }
  footer { margin-top: 48px; padding-top: 12px; border-top: 1px solid #E4E4E4; font-size: 14px; color: #8A8A8A; }
</style>
</head>
<body>
<main>
  <div class="fach">Chemie · J1</div>
  <h1>Versuch: Spaltung von Saccharose</h1>
  <div class="bar"></div>

  <div class="intro">
    <strong>So arbeitest du</strong><br>
    Lade die Versuchsanweisung herunter oder öffne sie direkt. Notiere deine Beobachtungen in der Tabelle.
  </div>

  <div class="downloads">
    <a class="btn" href="Versuch_Spaltung_von_Saccharose.pdf" download>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
      Versuchsanweisung herunterladen (PDF)
    </a>
    <a class="btn sec" href="Versuch_Spaltung_von_Saccharose.pdf" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      Im Browser öffnen
    </a>
  </div>

  <footer>Waibel · Chemie J1</footer>
</main>

</html>
