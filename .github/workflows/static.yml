# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download-Ordner vorbereiten (Dateiliste und ZIP)
        run: |
          mkdir -p download
          python3 - <<'PY'
          import json, os, subprocess, datetime
          root = 'download'
          skip = {'index.html', 'files.json', 'alles.zip', '.gitkeep'}
          files = []
          for d, _, names in os.walk(root):
              for n in names:
                  p = os.path.join(d, n)
                  rel = os.path.relpath(p, root)
                  if rel in skip or n.startswith('.'):
                      continue
                  date = subprocess.run(['git', 'log', '-1', '--format=%cI', '--', p],
                                        capture_output=True, text=True).stdout.strip()
                  files.append({'name': rel, 'size': os.path.getsize(p), 'date': date})
          built = datetime.datetime.now(datetime.timezone.utc).isoformat()
          json.dump({'built': built, 'files': files}, open(os.path.join(root, 'files.json'), 'w'), ensure_ascii=False)
          PY
          cd download
          rm -f alles.zip
          zip -q -r alles.zip . -x index.html files.json '.*' || true
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
