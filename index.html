<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Binär &amp; Hex auffrischen</title>
<style>
/* Lernpfad Binär & Hex – eine Datei, offline nutzbar, kein Login.
   Didaktik: kleine Schritte, erst ausprobieren, dann reflektieren (Tutorial-Hinweise mit kurzer Pause),
   Stellenwerte über das Bündeln (Zählwerk: eine volle Umdrehung = ein Bündel), offene Aufgaben, Merkzettel. */
:root {
  --bg: #14161c; --panel: #1d2029; --panel2: #252937; --line: #323748;
  --fg: #ece9e1; --muted: #9ba1b4;
  --lamp-on: #ffc94a; --lamp-glow: rgba(255,190,60,.5); --lamp-off: #2a2d38;
  --accent: #7fb2ff; --ok: #6fd39a; --hint: #ffd36b; --soft: #f0b37a;
  --f-ui: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --f-mono: "Cascadia Mono", Consolas, "DejaVu Sans Mono", ui-monospace, monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 17px/1.55 var(--f-ui); }
.wrap { max-width: 900px; margin: 0 auto; padding: 16px 16px 48px; }
h1 { font-size: clamp(1.25rem, 3vw, 1.7rem); margin: 0; }
h2 { font-size: 1.3rem; margin: 0; }
p { margin: 8px 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); }
button, input, textarea { font: inherit; color: inherit; }

header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.hbtns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #0d1424; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .4; cursor: default; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 0; }
nav button { background: var(--panel); border: 1px solid var(--line); border-radius: 99px; padding: 6px 13px; cursor: pointer; font-size: .92rem; color: var(--muted); }
nav button.active { border-color: var(--accent); color: var(--fg); background: var(--panel2); }
nav button.done { color: var(--ok); }
nav button.done::before { content: "✓ "; }
nav button.new { animation: pop .7s; }
@keyframes pop { 40% { transform: scale(1.14); } }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: clamp(16px, 3.5vw, 30px); margin-top: 14px; }
.chhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline; }
.dots { display: flex; gap: 6px; margin: 10px 0 18px; flex-wrap: wrap; }
.dots button { width: 28px; height: 8px; border-radius: 99px; border: 0; background: var(--line); padding: 0; cursor: pointer; }
.dots button.done { background: var(--ok); }
.dots button.cur { background: var(--accent); }
.dots button:disabled { cursor: default; }
.steptitle { font-weight: 700; font-size: 1.12rem; margin-bottom: 4px; }
.kind { display: inline-block; font-size: .75rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #0d1424; background: var(--hint); border-radius: 6px; padding: 1px 7px; margin-left: 8px; vertical-align: 2px; }
.kind.open { background: #b9a6ff; } .kind.partner { background: #8fe0c8; }
.stage { min-height: 190px; }
.fb { min-height: 1.6em; margin-top: 12px; font-weight: 600; }
.fb.ok { color: var(--ok); }
.fb.try { color: var(--soft); }
.helpbox p { color: var(--hint); margin: 6px 0; }
.navrow { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
input.ans { background: #10131a; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 9em; font-family: var(--f-mono); font-size: 1.1rem; }
input.ans.w2 { width: 4.2em; text-align: center; }
input.ans.wide { width: 16em; max-width: 100%; }
textarea { width: 100%; min-height: 96px; background: #10131a; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; resize: vertical; }
.box { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 10px 0; }

/* Zählwerk */
.counter { display: inline-flex; flex-direction: column; gap: 6px; }
.wheels { display: inline-flex; gap: 8px; padding: 10px; background: #0d0f14; border-radius: 12px; border: 1px solid var(--line); }
.wheel { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.wheel .face { display: grid; place-items: center; width: 58px; height: 74px; background: linear-gradient(#262a38, #1a1d27 50%, #262a38); border-radius: 8px; font: 700 2.3rem var(--f-mono); border: 1px solid #343a4d; }
.wheel .face.flip { animation: flip .4s; }
.wheel .face.full { box-shadow: 0 0 0 3px var(--hint); }
@keyframes flip { 0% { transform: rotateX(85deg); opacity: .2; } }
.wheel .lab { font: .78rem var(--f-mono); color: var(--muted); min-height: 1.2em; text-align: center; max-width: 76px; }
.wheel .lab.known { color: var(--hint); font-weight: 700; }
.clicks { font-size: .9rem; color: var(--muted); }

/* Lampen */
.lamps { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: clamp(6px, 1.4vw, 14px); max-width: 640px; margin: 8px 0; }
.bit { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.lamp { width: 100%; max-width: 66px; aspect-ratio: 1; border-radius: 50%; border: 3px solid var(--line); padding: 0;
  background: radial-gradient(circle at 35% 30%, #3a3e4c, var(--lamp-off) 65%); cursor: pointer; transition: box-shadow .2s; }
.lamp.on { background: radial-gradient(circle at 35% 30%, #fff6d8, var(--lamp-on) 55%, #e09a1c); border-color: #ffd97a; box-shadow: 0 0 16px 5px var(--lamp-glow); }
.lamp:disabled { cursor: default; }
.bit .d { font: 700 1.05rem var(--f-mono); color: var(--muted); }
.bit.on .d { color: var(--lamp-on); }
.bit .pv { font: .85rem var(--f-mono); color: var(--muted); }
.decval { font: 700 1.6rem var(--f-mono); min-height: 1.6em; }

/* Auswahl, Zuordnen, Byte */
.opts { display: flex; flex-direction: column; gap: 8px; max-width: 580px; }
.opt { text-align: left; background: #10131a; border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--muted); }
.opt.right { border-color: var(--ok); }
.opt.tried { border-color: var(--soft); opacity: .75; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; max-width: 460px; }
.mcol { display: flex; flex-direction: column; gap: 8px; }
.mcard { background: #10131a; border: 2px solid var(--line); border-radius: 10px; padding: 7px; cursor: pointer; font: 700 1.2rem var(--f-mono); }
.mcard.sel { border-color: var(--accent); }
.mcard.done { border-color: var(--ok); color: var(--ok); opacity: .7; cursor: default; }
.mcard.shake { animation: shake .3s; border-color: var(--soft); }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.byte { display: inline-flex; gap: 14px; margin: 8px 0; flex-wrap: wrap; }
.nib { text-align: center; }
.nib .b { font: 700 1.9rem var(--f-mono); letter-spacing: .08em; background: #10131a; border: 1px solid var(--line); border-radius: 10px; padding: 2px 10px; display: inline-block; }
.nib .p { font: .8rem var(--f-mono); color: var(--muted); letter-spacing: .62em; padding-left: .6em; }
.nib .r { margin-top: 6px; }

/* Farben */
.mixer { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 16px; align-items: center; max-width: 680px; }
.sw { width: 100%; aspect-ratio: 1; border-radius: 14px; border: 2px solid var(--line); }
.chan { display: grid; grid-template-columns: 50px minmax(0, 1fr) 42px 34px; gap: 8px; align-items: center; margin: 6px 0; font-family: var(--f-mono); }
.hexbig { font: 700 1.5rem var(--f-mono); }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch { width: 96px; height: 72px; border-radius: 10px; border: 3px solid var(--line); cursor: pointer; padding: 0; }
.swatch.right { border-color: var(--ok); } .swatch.tried { border-color: var(--soft); opacity: .6; }

/* Merkzettel, Spiele */
.merk { border-left: 4px solid var(--hint); background: var(--panel2); border-radius: 0 12px 12px 0; padding: 10px 14px; margin: 10px 0; }
.merk h3 { margin: 0 0 4px; font-size: 1rem; color: var(--hint); }
.note { border-left: 4px solid #b9a6ff; background: var(--panel2); border-radius: 0 12px 12px 0; padding: 8px 14px; margin: 8px 0; }
.note b { color: #b9a6ff; }
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.game { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.game a { color: var(--accent); font-weight: 700; text-decoration: none; }
.game a:hover { text-decoration: underline; }
.tag { font-size: .75rem; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; color: var(--muted); margin-right: 4px; }

/* Dialoge & Tutorial-Hinweis */
dialog { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 16px; padding: 22px; max-width: 560px; width: calc(100% - 32px); }
dialog::backdrop { background: rgba(0,0,0,.6); }
#tut { border: 2px solid var(--hint); max-width: 520px; }
#tut h2 { color: var(--hint); font-size: 1.15rem; }
#tut .tbody { font-size: 1.05rem; }
#tut .think { margin-top: 10px; padding: 8px 12px; border-radius: 10px; background: var(--panel2); }
.timer { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 14px 0 10px; }
.timer > div { height: 100%; width: 0; background: var(--hint); }
.code { font: 700 2rem var(--f-mono); letter-spacing: .12em; text-align: center; background: #0d0f14; border: 2px dashed var(--lamp-on); color: var(--lamp-on); border-radius: 12px; padding: 12px; margin: 12px 0; }
.big { font-size: 1.1rem; }

@media (max-width: 620px) {
  .mixer { grid-template-columns: 1fr; } .mixer .sw { max-width: 130px; }
  .wheel .face { width: 44px; height: 58px; font-size: 1.8rem; }
  .wheel .lab { max-width: 52px; font-size: .7rem; }
  .nib .b { font-size: 1.5rem; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Binär &amp; Hex auffrischen</h1><div class="muted">Lernpfad · ca. 25 Minuten</div></div>
    <div class="hbtns">
      <button class="btn" id="btnSave">💾 Speichercode</button>
    </div>
  </header>
  <nav id="nav"></nav>
  <main class="card" id="main"></main>
</div>

<dialog id="tut" aria-labelledby="tutT">
  <h2 id="tutT"></h2>
  <div class="tbody" id="tutB"></div>
  <div class="timer" aria-hidden="true"><div id="tutBar"></div></div>
  <div class="row" style="justify-content:flex-end"><button class="btn primary" id="tutOk" disabled>Verstanden</button></div>
</dialog>
<dialog id="dlgSave">
  <h2>Dein Speichercode</h2>
  <p class="muted">Schreib ihn dir auf. Mit diesem Code geht es später genau hier weiter.</p>
  <div class="code" id="codeOut"></div>
  <div class="row" style="justify-content:flex-end"><button class="btn primary" data-close>OK</button></div>
</dialog>
<dialog id="dlgTeacher">
  <h2>Lehrkraft</h2>
  <p class="muted">Bis wohin soll freigeschaltet werden? Alle Kapitel davor gelten dann als erledigt.</p>
  <div class="opts" id="teachOpts"></div>
  <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-close>Abbrechen</button></div>
</dialog>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const bin = (v, n) => v.toString(2).padStart(n, "0");
const bin8 = (v) => { const s = bin(v, 8); return s.slice(0, 4) + " " + s.slice(4); };
const hex = (v, n) => v.toString(16).toUpperCase().padStart(n, "0");
const clean = (s) => String(s).replace(/\s+/g, "").replace(/^#/, "").toUpperCase();
const strip0 = (s) => s.replace(/^0+(?=.)/, "");
const h = (tag, attrs = {}, html = "") => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); e.innerHTML = html; return e; };
const PRAISE = ["Genau!", "Stark!", "Richtig!", "Sehr gut!", "Super!"];
const praise = () => PRAISE[rnd(0, PRAISE.length - 1)];
const TEACHER_CODE = "LK7Q4M";
const TUT_SECS = 3;   // Sperrzeit der Tutorial-Hinweise in Sekunden

// ============================================================
// Tutorial-Hinweis: erscheint genau dann, wenn etwas passiert, und lässt sich erst nach kurzer Pause schließen
// ============================================================
const tutQueue = []; let tutBusy = false, tutMute = false;
function tutorial(title, html, secs = 5, think) {
  if (tutMute) return Promise.resolve();          // bei schon gelösten Schritten keine Hinweise wiederholen
  return new Promise((res) => { tutQueue.push({ title, html, secs: TUT_SECS, think, res }); if (!tutBusy) nextTut(); });
}
function nextTut() {
  const t = tutQueue.shift(); if (!t) { tutBusy = false; return; }
  tutBusy = true;
  $("tutT").textContent = "💡 " + t.title;
  $("tutB").innerHTML = t.html + (t.think ? `<div class="think">🤔 ${t.think}</div>` : "");
  const ok = $("tutOk"), bar = $("tutBar"); ok.disabled = true;
  bar.style.transition = "none"; bar.style.width = "0";
  $("tut").showModal();
  requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = `width ${t.secs}s linear`; bar.style.width = "100%"; }));
  setTimeout(() => { ok.disabled = false; ok.focus(); }, t.secs * 1000);
  ok.onclick = () => { $("tut").close(); t.res(); setTimeout(nextTut, 150); };
}
$("tut").addEventListener("cancel", (e) => { if ($("tutOk").disabled) e.preventDefault(); });

// ============================================================
// Bausteine (Widgets). ctx = { el, solved(msg), hint(msg) }
// ============================================================
// Zählwerk mit Rädchen; zeigt bei jedem Rädchen, nach wie vielen Klicks es sich zum ersten Mal bewegt (= Stellenwert)
function counterWidget(ctx, { base, wheels = 4, start = 0, goal, goalMsg, events = [], reveal = true, showClicks = true }) {
  let v = start, clicks = 0; const moved = new Array(wheels).fill(false);
  const digit = (x, i) => hex(Math.floor(x / base ** i) % base, 1);
  const box = h("div", { class: "counter" }), wrow = h("div", { class: "wheels" }), info = h("div", { class: "clicks" });
  const faces = [], labs = [];
  for (let i = wheels - 1; i >= 0; i--) {
    const w = h("div", { class: "wheel" }), f = h("div", { class: "face" }), l = h("div", { class: "lab" });
    w.append(f, l); wrow.append(w); faces[i] = f; labs[i] = l;
  }
  const draw = (prev) => {
    for (let i = 0; i < wheels; i++) {
      const d = digit(v, i), changed = prev !== undefined && digit(prev, i) !== d;
      faces[i].textContent = d;
      faces[i].classList.toggle("full", d === hex(base - 1, 1));
      if (changed) { faces[i].classList.remove("flip"); void faces[i].offsetWidth; faces[i].classList.add("flip"); }
      if (changed && i > 0 && !moved[i] && reveal) { moved[i] = true; labs[i].textContent = `nach ${clicks} Klicks`; labs[i].classList.add("known"); }
    }
    info.textContent = showClicks ? `Klicks bisher: ${clicks}` : "";
  };
  if (reveal) { labs[0].textContent = "jeder Klick"; labs[0].classList.add("known"); for (let i = 1; i < wheels; i++) labs[i].textContent = "?"; }
  const plus = h("button", { class: "btn primary" }, "+1 drehen");
  let busy = false;
  plus.onclick = async () => {
    if (busy || plus.disabled) return; const prev = v; v++; clicks++; draw(prev);
    busy = true;
    for (const e of events) if (!e.done && e.when(v, prev, clicks)) { e.done = true; await tutorial(e.title, e.text, e.secs || 5, e.think); }
    busy = false;
    if (goal && goal(v, clicks)) { plus.disabled = true; ctx.solved(goalMsg); }
  };
  box.append(wrow, info);
  const row = h("div", { class: "row", style: "margin-top:12px" }); row.append(plus);
  ctx.el.append(box, row);
  draw();
}
function staticCounter(el, base, value, wheels = 4) {
  const w = h("div", { class: "wheels" });
  for (let i = wheels - 1; i >= 0; i--) w.append(h("div", { class: "wheel" }, `<div class="face">${hex(Math.floor(value / base ** i) % base, 1)}</div>`));
  el.append(w);
}
// Eingabefelder; check(values) → true | Text (Hinweis) | null (allgemeiner Hinweis)
function inputWidget(ctx, { fields, check, okMsg }) {
  const row = h("div", { class: "row", style: "margin-top:10px" });
  const ins = fields.map((f) => {
    if (f.label) row.append(h("span", {}, f.label));
    const inp = h("input", { class: "ans " + (f.w || ""), "aria-label": f.aria || f.label || "Antwort", autocomplete: "off" });
    if (f.max) inp.maxLength = f.max;
    row.append(inp); return inp;
  });
  const btn = h("button", { class: "btn primary" }, "Prüfen");
  row.append(btn); ctx.el.append(row);
  const go = () => {
    const vals = ins.map((x) => clean(x.value));
    if (vals.some((x) => x === "")) { ctx.hint("Fülle zuerst alle Felder aus."); return; }
    const r = check(vals);
    if (r === true) { ins.forEach((x) => x.disabled = true); btn.disabled = true; ctx.solved(typeof okMsg === "function" ? okMsg(vals) : okMsg); }
    else ctx.hint(r || "Noch nicht ganz – probier es noch einmal.");
  };
  btn.onclick = go; ins.forEach((x) => x.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); }));
  setTimeout(() => ins[0].focus({ preventScroll: true }), 50);
}
// Offene Aufgabe: freie Antwort (wird nur während der Sitzung behalten)
function textWidget(ctx, { key, min = 25, placeholder = "", check, okMsg = "Fertig – weiter geht's." }) {
  const ta = h("textarea", { "aria-label": "Deine Antwort", placeholder });
  ta.value = NOTES[key] || "";
  const btn = h("button", { class: "btn primary" }, "Fertig");
  const row = h("div", { class: "row", style: "margin-top:8px" }); row.append(btn);
  ctx.el.append(ta, row);
  btn.onclick = () => {
    const t = ta.value.trim();
    if (t.length < min) { ctx.hint("Schreib noch ein bisschen mehr – ein bis zwei ganze Sätze."); return; }
    if (check) { const r = check(t); if (r !== true) { ctx.hint(r); return; } }
    NOTES[key] = t; ctx.solved(okMsg);
  };
}
function mcWidget(ctx, { opts, anyOk }) {
  const box = h("div", { class: "opts" });
  opts.forEach((o) => {
    const b = h("button", { class: "opt" }, o.t);
    b.onclick = () => {
      if (o.ok || anyOk) { b.classList.add("right"); box.querySelectorAll(".opt").forEach((x) => x.disabled = true); ctx.solved(o.fb); }
      else { b.classList.add("tried"); b.disabled = true; ctx.hint(o.fb); }
    };
    box.append(b);
  });
  ctx.el.append(box);
}
function lampsWidget(ctx, { n, mode, target, value = 0, showPV = true, showDec = false, goal, goalMsg, feedback, events = [] }) {
  let v = mode === "read" ? target : value, busy = false;
  const grid = h("div", { class: "lamps" }); grid.style.setProperty("--n", n);
  const dec = h("div", { class: "decval" });
  const draw = () => {
    grid.innerHTML = "";
    for (let i = n - 1; i >= 0; i--) {
      const on = (v >> i) & 1, d = h("div", { class: "bit" + (on ? " on" : "") });
      const l = h("button", { class: "lamp" + (on ? " on" : ""), "aria-label": "Bit mit Stellenwert " + 2 ** i, "aria-pressed": on ? "true" : "false" });
      if (mode === "read") l.disabled = true;
      l.onclick = async () => {
        if (busy) return; const prev = v; v ^= 1 << i; draw(); busy = true;
        for (const e of events) if (!e.done && e.when(v, prev)) { e.done = true; await tutorial(e.title, e.text, e.secs || 5, e.think); }
        busy = false;
        if (goal && goal(v)) ctx.solved(goalMsg);
      };
      d.append(l, h("div", { class: "d" }, String(on)));
      if (showPV) d.append(h("div", { class: "pv" }, String(2 ** i)));
      grid.append(d);
    }
    dec.innerHTML = showDec ? `= ${v}` : "";
  };
  draw(); ctx.el.append(grid, dec);
  if (mode === "read") inputWidget(ctx, { fields: [{ label: "Dezimalzahl:" }], check: ([a]) => +a === target || (feedback ? feedback(+a) : null) });
  if (mode === "set") {
    const btn = h("button", { class: "btn primary" }, "Prüfen");
    btn.onclick = () => {
      if (v === target) { grid.querySelectorAll(".lamp").forEach((x) => x.disabled = true); btn.disabled = true; ctx.solved(); }
      else ctx.hint(`Die Lampen zeigen gerade ${v}. ` + (v > target ? "Das ist mehr als " + target + "." : "Bis " + target + " fehlt noch etwas."));
    };
    const row = h("div", { class: "row" }); row.append(btn); ctx.el.append(row);
  }
  return { get: () => v };

function matchWidget(ctx, { values }) {
  const L = h("div", { class: "mcol" }), R = h("div", { class: "mcol" });
  let sel = null, matched = 0;
  const pick = (c, side) => {
    if (c.classList.contains("done")) return;
    if (!sel || sel.side === side) { (side === "L" ? L : R).querySelectorAll(".mcard").forEach((x) => x.classList.remove("sel")); c.classList.add("sel"); sel = { c, side }; return; }
    if (sel.c.dataset.v === c.dataset.v) {
      [sel.c, c].forEach((x) => { x.classList.remove("sel"); x.classList.add("done"); });
      if (++matched === values.length) ctx.solved("Alle Paare gefunden!");
    } else { const a = sel.c; [a, c].forEach((x) => x.classList.add("shake")); setTimeout(() => [a, c].forEach((x) => x.classList.remove("shake", "sel")), 380); ctx.hint("Das passt noch nicht – rechne das Bitmuster mit 8 · 4 · 2 · 1 aus."); }
    sel = null;
  };
  values.forEach((v) => { const c = h("button", { class: "mcard", "data-v": v }, bin(v, 4)); c.onclick = () => pick(c, "L"); L.append(c); });
  shuffle([...values]).forEach((v) => { const c = h("button", { class: "mcard", "data-v": v }, hex(v, 1)); c.onclick = () => pick(c, "R"); R.append(c); });
  const m = h("div", { class: "match" }); m.append(L, R); ctx.el.append(m);
}
function byteWidget(ctx, { value, guided, halves = true }) {
  const s = bin(value, 8), hi = s.slice(0, 4), lo = s.slice(4), H = hex(value, 2);

  else {
    const byte = h("div", { class: "byte" });

      const done = guided && k === 0;
      byte.append(h("div", { class: "nib" }, `<div class="b">${q}</div><div class="p">8421</div>
        <div class="r mono">${done ? `${q.split("").map((c, i) => c === "1" ? [8, 4, 2, 1][i] : null).filter(Boolean).join(" + ")} = ${parseInt(q, 2)} = <b>${H[0]}</b>` : ""}</div>`));
    });
    ctx.el.append(byte);
  }
  const fbFor = (got, part) => { const d = parseInt(part, 2); return got === String(d) && d > 9 ? `${d} ist richtig gerechnet – als Hex-Ziffer schreibt man dafür ein einziges Zeichen.` : null; };

    check: ([a]) => a.padStart(2, "0") === H || (a.length === 1 ? "Ein Byte ergibt immer zwei Hex-Ziffern – teile es in zwei Hälften." : null) });

  else inputWidget(ctx, { fields: [{ label: "links:", w: "w2", max: 2 }, { label: "rechts:", w: "w2", max: 2 }], okMsg: `${praise()} Zusammen: <b>${H}</b>.`,
    check: ([a, b]) => (a === H[0] && b === H[1]) || fbFor(a, hi) || fbFor(b, lo) || (a === H[0] ? "Die linke Hälfte stimmt schon!" : b === H[1] ? "Die rechte Hälfte stimmt schon!" : null) });
}
function mixerWidget(ctx, { start = [128, 128, 128], goal, goalMsg, events = [] }) {
  const c = [...start], names = ["Rot", "Grün", "Blau"], cols = ["#ff6b6b", "#5fd38d", "#6fa8ff"];
  const box = h("div", { class: "mixer" }), left = h("div"), right = h("div");
  const sw = h("div", { class: "sw" }), code = h("div", { class: "hexbig", style: "text-align:center;margin-top:6px" });
  let solved = false;
  names.forEach((n, i) => {
    const row = h("div", { class: "chan" }, `<span style="color:${cols[i]}">${n}</span>`);
    const r = h("input", { type: "range", min: 0, max: 255, value: c[i], "aria-label": n, style: `accent-color:${cols[i]}` });
    const d = h("span"), x = h("b");
    r.oninput = () => { c[i] = +r.value; draw(); };
    r.onchange = async () => {
      for (const e of events) if (!e.done && e.when(c)) { e.done = true; await tutorial(e.title, e.text, e.secs || 5, e.think); }
      if (!solved && goal && goal(c)) { solved = true; ctx.solved(goalMsg); }
    };
    row.append(r, d, x); left.append(row); row._d = d; row._x = x;
  });
  const draw = () => { [...left.children].forEach((row, i) => { row._d.textContent = c[i]; row._x.textContent = hex(c[i], 2); });
    const s = "#" + c.map((v) => hex(v, 2)).join(""); sw.style.background = s; code.textContent = s; };
  right.append(sw, code); box.append(left, right); ctx.el.append(box); draw();

}
function swatchWidget(ctx, { code, options }) {
  ctx.el.append(h("p", {}, `Welches Feld hat die Farbe <span class="hexbig">#${code}</span>?`));

  });

const P = { unl: 0, ch: [0, 0, 0, 0], fin: false, finScore: 0 };   // unl = von der Lehrkraft freigeschaltet bis (0–5)

const chDone = (k) => P.ch[k] >= CH[k].steps.length;
function unlocked(k) {               // 0–3 Kapitel, 4 Abschluss-Check, 5 Belohnung
  if (k === 5) return P.fin || P.unl >= 5;
  if (k === 4) return chDone(3) || P.fin || P.unl >= 4;
  return k === 0 || P.ch[k] > 0 || chDone(k - 1) || P.unl >= k;
}
const ALPHA = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ", MASK = 0x15A3C96n;
function pack() {

}

}

  if (v !== 3n || unl > 5) return null;
  return { unl, ch: ch.map((x, k) => Math.min(x, CH[k].steps.length)), fin: !!fin, finScore: Math.min(finScore, 12) };
}

  if (q.choice) { const box = h("div", { class: "row" }); let val = ""; q.choice.forEach((n) => { const b = h("button", { class: "opt" }, n); b.onclick = () => { val = n; box.querySelectorAll(".opt").forEach((x) => x.classList.toggle("right", x === b)); }; box.append(b); }); row.append(box); get = () => val; }
  else { const inp = h("input", { class: "ans", "aria-label": "Antwort", autocomplete: "off" }); row.append(inp); get = () => clean(inp.value); setTimeout(() => inp.focus({ preventScroll: true }), 50);
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") nb.click(); }); }
  nb.onclick = () => { finAns[finIdx] = get(); finIdx++; render(); };
  const nrow = h("div", { class: "row", style: "margin-top:12px" }); nrow.append(nb);
  m.append(row, nrow);
}
function renderFinalResult(m) {
  const norm = (q, a) => q.choice ? a : q.pad ? (a || "").padStart(q.pad, "0") : strip0(a || "");
  const ok = fin.map((q, i) => norm(q, finAns[i]) === q.a), sc = ok.filter(Boolean).length;
  P.fin = true; P.finScore = Math.max(P.finScore, sc); update();
  const n = fin.length;
  m.append(h("h2", {}, "Auswertung"));
  const lead = sc === n ? `Alle ${n} richtig – stark!` : sc >= n / 2 ? `${sc} von ${n} richtig – gut gemacht!` : `${sc} von ${n} richtig. Bei den markierten Aufgaben lohnt sich ein zweiter Blick ins Kapitel.`;
  m.append(h("p", { class: "big" }, lead));
  fin.forEach((q, i) => m.append(h("div", { class: "box" }, `${ok[i] ? "✓" : "↻"} ${q.q}${ok[i] ? "" : `<br><span class="muted">Dazu passt Kapitel ${q.ch + 1}</span>`}`)));
  const row = h("div", { class: "row", style: "margin-top:14px" });
  const r = h("button", { class: "btn primary big" }, "Weiter"); r.onclick = () => go({ page: "reward" });
  const a = h("button", { class: "btn" }, "Noch einmal mit neuen Aufgaben"); a.onclick = () => go({ page: "fin", restart: true });
  row.append(r, a); m.append(row);
}

// ---------- Belohnung ----------
function renderReward(m) {
  if (!unlocked(5)) { m.append(h("p", {}, "Hier gibt es noch nichts zu sehen.")); return; }
  m.append(h("h2", {}, "🎉 Geschafft!"));
  m.append(h("p", {}, "Du bist durch den ganzen Lernpfad gekommen. Such dir ein Spiel aus, mit dem du weiterüben willst – es öffnet sich in einem neuen Tab."));
  const g = h("div", { class: "games" });
  GAMES.forEach(([n, u, d, t, l]) => g.append(h("div", { class: "game" }, `<a href="${u}" target="_blank" rel="noopener noreferrer">${n} ↗</a><div style="margin:4px 0"><span class="tag">${t}</span><span class="tag">${l}</span></div><div class="muted">${d}</div>`)));
  m.append(g);
}

// ---------- Kopf ----------
$("btnSave").onclick = () => { $("codeOut").textContent = encode(); $("dlgSave").showModal(); };
document.querySelectorAll("[data-close]").forEach((b) => b.onclick = () => b.closest("dialog").close());

// ---------- Start ----------
try { const s = localStorage.getItem("binhex-lernpfad3"); const st = s && decode(s); if (st) Object.assign(P, st); } catch (e) { /* kein Speicher */ }
render();
</script>
